<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOMU — Beyond Hydration | Botanical Distillates</title>
    <meta name="description" content="Four herbs. Zero nonsense. Whole botanical distillates crafted in small batches across Chennai." />
    <link rel="icon" type="image/png" href="/img/nomu/nomu_symbol_master.png" />

    <!-- 1. High-priority LCP image preload for immediate mobile paint -->
    <link rel="preload" as="image" href="/img/bottles/vetiver_isolated.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/img/nomu/nomu_film_poster.webp" type="image/webp" fetchpriority="high" />

    <!-- 2. Non-blocking asynchronous typography delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- 3. Critical Pre-Paint Skeleton Styles to eliminate layout shifts & accelerate FCP -->
    <style>
      :root {
        --nomu-terracotta: #4E301B;
        --nomu-ink: #111111;
        --nomu-cream: #E6D5BD;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { background-color: var(--nomu-terracotta); }
      body {
        margin: 0;
        background-color: var(--nomu-terracotta);
        color: #FFFFFF;
        font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
